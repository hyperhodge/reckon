# SPDX-License-Identifier: Apache-2.0
name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: store/tests
        run: python -m unittest discover -s store/tests
      - name: wrapper/tests
        run: python -m unittest discover -s wrapper/tests
      - name: estimator/tests
        run: python -m unittest discover -s estimator/tests
      - name: ledger/tests
        run: python -m unittest discover -s ledger/tests
